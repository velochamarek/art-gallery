<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Lavishly+Yours&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <section id="landing">
        <h1>Welcome to the Art Gallery</h1>
        <button class="museum-btn" id="enterBtn">
            Enter the Museum
        </button>
    </section>

    <section id="gallery">
        <div id="nadpis"><h1>Interaktivní muzeum slavných obrazů</h1></div>
        <div id="main_mistnost">
            <img class="obrazy" src="./art/creation_of_human.jpeg" width="20%" height="20%" alt="Creation of Human" />
            <img class="obrazy" src="./art/girl_with_earring.jpg" width="10%" height="10%" alt="Girl with a Pearl Earring" />
        </div>
    </section>

    <script src="button.js"></script>
</body>
</html>
