<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Museum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1A1C2E;
      --surface: #242840;
      --border: #2E3250;
      --gold: #C9A84C;
      --text: #E8E2D0;
      --secondary: #8A9BB5;
      --muted: #4A5570;
    } 

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse 800px 600px at 50% 50%, rgba(201,168,76,0.04) 0%, transparent 70%), var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
      overflow: hidden;
    }

    .lang-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
      width: 92px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(36, 40, 64, 0.75);
      color: var(--text);
      padding: 0;
      cursor: pointer;
      transition: border-color 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    .lang-toggle:hover {
      border-color: var(--gold);
    }

    .lang-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 42px;
      height: 28px;
      border-radius: 999px;
      background: var(--gold);
      transition: transform 0.28s ease;
    }

    .lang-toggle.is-en .lang-thumb {
      transform: translateX(44px);
    }

    .lang-option {
      position: relative;
      z-index: 1;
      width: 46px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.06em;
      font-weight: 600;
      color: var(--secondary);
      transition: color 0.2s ease;
      user-select: none;
      pointer-events: none;
    }

    .lang-toggle:not(.is-en) .lang-option.cz,
    .lang-toggle.is-en .lang-option.en {
      color: var(--bg);
    }

    #hero {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px 20px;
      position: relative;
    }

    .hero-content {
      transition: transform 0.9s ease, filter 0.9s ease, opacity 0.9s ease;
    }

    .hero-content.intro-start {
      transform: translateY(-50px);
      filter: blur(12px);
      opacity: 0;
    }

    .hero-content.exit {
      transform: translateY(-50px);
      filter: blur(14px);
      opacity: 0;
    }

    .overline {
      color: var(--gold);
      letter-spacing: 0.35em;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(56px, 8vw, 110px);
      line-height: 0.95;
      color: var(--text);
      margin-bottom: 14px;
      font-weight: 600;
    }

    .subtitle {
      color: var(--secondary);
      font-size: 18px;
      font-style: italic;
      margin-bottom: 34px;
    }

    #enterBtn {
      border: 1px solid var(--gold);
      color: var(--gold);
      background: transparent;
      padding: 14px 40px;
      font-size: 14px;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease;
      font-family: "Inter", sans-serif;
    }

    #enterBtn:hover {
      background: var(--gold);
      color: var(--bg);
    }
  </style>
</head>
<body>
  <button id="langToggle" class="lang-toggle" type="button" aria-label="Switch language CZ/EN">
    <span class="lang-thumb" aria-hidden="true"></span>
    <span class="lang-option cz">CZ</span>
    <span class="lang-option en">EN</span>
  </button>

  <section id="hero">
    <div id="heroContent" class="hero-content intro-start">
      <div id="overline" class="overline">WELCOME TO</div>
      <h1 id="heroTitle">Interactive Museum</h1>
      <p id="subtitle" class="subtitle">A journey through the world's most famous masterpieces</p>
      <button id="enterBtn" type="button">Vstup do muzea</button>
    </div>
  </section>

  <script>
    const LANG_KEY = "museumLang";

    const texts = {
      cz: {
        overline: "VÍTEJTE V",
        title: "Interaktivní muzeum",
        subtitle: "Cesta skrz nejznámější mistrovská díla světa",
        cta: "Vstup do muzea"
      },
      en: {
        overline: "WELCOME TO",
        title: "Interactive Museum",
        subtitle: "A journey through the world's most famous masterpieces",
        cta: "Enter the Gallery"
      }
    };

    let currentLang = localStorage.getItem(LANG_KEY) === "en" ? "en" : "cz";

    const overlineEl = document.getElementById("overline");
    const titleEl = document.getElementById("heroTitle");
    const subtitleEl = document.getElementById("subtitle");
    const enterBtn = document.getElementById("enterBtn");
    const langToggle = document.getElementById("langToggle");
    const heroContent = document.getElementById("heroContent");

    function syncLangToggleState() {
      langToggle.classList.toggle("is-en", currentLang === "en");
    }

    function applyLanguage(lang) {
      const t = texts[lang];
      overlineEl.textContent = t.overline;
      titleEl.textContent = t.title;
      subtitleEl.textContent = t.subtitle;
      enterBtn.textContent = t.cta;
      document.documentElement.lang = lang;
      localStorage.setItem(LANG_KEY, lang);
      syncLangToggleState();
    }

    langToggle.addEventListener("click", () => {
      currentLang = currentLang === "cz" ? "en" : "cz";
      applyLanguage(currentLang);
    });

    window.addEventListener("load", () => {
      applyLanguage(currentLang);
      setTimeout(() => {
        heroContent.classList.remove("intro-start");
      }, 350);
    });

    enterBtn.addEventListener("click", () => {
      enterBtn.disabled = true;
      localStorage.setItem("audioAllowed", "yes");
      heroContent.classList.add("exit");
      setTimeout(() => {
        window.location.href = "index_mistnost.html";
      }, 900);
    });
  </script>
</body>
</html>
